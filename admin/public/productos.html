<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos — Admin Chronos</title>
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="css/admin.css">
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('watchstore_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="logo">Chronos<span class="dot">.</span></div>
    <a href="index.html">📊 Dashboard</a>
    <a href="productos.html" class="active">⌚ Productos</a>
    <a href="pedidos.html">📦 Pedidos</a>
    <div class="divider"></div>
    <a href="/index.html" target="_blank">🔗 Ver tienda</a>
    <a href="#" id="logout-link">🚪 Cerrar sesión</a>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Productos</h1>
      <div class="flex gap-8">
        <button class="icon-btn" data-theme-toggle aria-label="Cambiar tema"><span data-theme-icon>🌙</span></button>
        <a href="producto-editar.html" class="btn btn-primary">+ Nuevo producto</a>
      </div>
    </div>
    <div class="panel" style="padding:14px 18px;">
      <input type="text" id="search-input" placeholder="Buscar por nombre…" style="width:100%;max-width:320px;padding:9px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);">
    </div>
    <div id="products-root"><div class="loading-row"><span class="spinner"></span> Cargando…</div></div>
  </main>
</div>

<script type="module" src="js/layout.js"></script>
<script type="module" src="js/productos.js"></script>
</body>
</html>
